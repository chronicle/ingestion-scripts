server {
    listen ${PORT};
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    client_max_body_size 50M;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # Backend-for-Frontend: Server-Side GCP Storage API Proxy
    location /api/gcp/storage/ {
        include /etc/nginx/gcp_token.conf;
        proxy_pass https://storage.googleapis.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host storage.googleapis.com;
        proxy_buffering off;
    }

    # Backend-for-Frontend: Server-Side GCP Compute Engine API Proxy
    location /api/gcp/compute/ {
        include /etc/nginx/gcp_token.conf;
        proxy_pass https://compute.googleapis.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host compute.googleapis.com;
        proxy_buffering off;
    }

    location /api/log {
        access_log /dev/stdout;
        return 200 "OK\n";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
